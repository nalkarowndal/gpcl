name: Windows Portable EXE

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'server/**'
      - 'test/**'
      - 'scripts/**'
      - 'assets-source/**'
      - 'docs/art/**'
      - 'package.json'
      - '.github/workflows/windows-portable.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Only used to publish an official versioned EXE on main.

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron packaging tools
        run: npm install --no-audit --no-fund
      - name: Test idle motion and existing integrations
        run: npm test
      - name: Build direct-run Windows x64 portable executable
        run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate EXE header, size and checksums
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem "dist/portable/GPT-Pixel-Office-*-portable-x64.exe" -ErrorAction Stop)
          if ($exe.Count -ne 1) { throw "Expected exactly one portable .exe" }
          if ($exe[0].Length -lt 20000000) { throw "Portable executable unexpectedly small" }
          $stream = [System.IO.File]::OpenRead($exe[0].FullName)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Not a valid Windows PE executable" }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash
          "$hash  $($exe[0].Name)" | Set-Content -Path "dist/portable/SHA256SUMS.txt" -Encoding utf8
          Write-Host "Verified portable executable: $($exe[0].Name) ($($exe[0].Length) bytes)"
      - name: Upload portable EXE (no installer)
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Pixel-Office-Windows-Portable-x64
          path: |
            dist/portable/*.exe
            dist/portable/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
      - name: Publish downloadable Windows EXE release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.0
          target_commitish: ${{ github.sha }}
          name: GPT Pixel Office 4.2.0 — G2 Character Art & Animation
          body: |
            G2 character art release for GPT Pixel Office: original 32x48px pixel sprites
            for Mimi, Nori, Pico and Luna. 12 cycles and 66 tagged poses per character.
            Adds detailed outfits, hairstyles, blinks, 4-way walking and everyday activities.
            Both Room and Taskbar modes use the same validated PNG/JSON atlases.
            User interface, native system tray, independent fictional NPC movement,
            GPT Live task monitor and 25-minute focus timer remain available.
            Single-file Windows x64 portable EXE. No installer or separate Node.js needed.
            The file is unsigned and may trigger Windows SmartScreen.
            Verify the binary with SHA256SUMS.txt.
          files: |
            dist/portable/*.exe
            dist/portable/SHA256SUMS.txt
          fail_on_unmatched_files: true
