<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>GPT Pixel Office · Little Cozy Room</title>
<link rel="stylesheet" href="/mini.css">
</head>
<body data-layout="room">
<div class="companion" id="companion">
  <header class="titlebar">
    <div class="drag-area" aria-label="드래그하여 미니 창 이동">
      <span class="tiny-star">✿</span>
      <div class="titlecopy"><strong>Little Pixel Office</strong><small>YOUR COZY DESKTOP FRIENDS</small></div>
      <span class="titlebar-drag">⋮⋮</span>
    </div>
    <div class="window-controls">
      <button type="button" id="layout-toggle" class="window-btn emphasized" title="Room / Taskbar 모드 변경">▰</button>
      <button type="button" id="dock-btn" class="window-btn" title="작업 표시줄 위로 정렬">⌄</button>
      <button type="button" id="pin-btn" class="window-btn" title="항상 위에 표시">♢</button>
      <button type="button" id="open-dashboard" class="window-btn" title="전체 GPT 대시보드 열기">▣</button>
      <button type="button" id="hide-btn" class="window-btn close" title="트레이로 숨기기">×</button>
    </div>
  </header>
  <div class="scene-stage">
    <canvas id="room-canvas" width="960" height="580" role="img" aria-label="자유롭게 움직이는 픽셀 캐릭터와 고양이가 있는 작은 입체 방"></canvas>
    <span class="mood-label" id="mood-label">☁ peaceful day</span>
    <span class="live-signal" id="live-signal">☕ IDLE · 4 FRIENDS</span>
    <span class="room-hint" id="room-hint">고양이를 클릭해 보세요 · 꾹 누르지 않아도 자동으로 움직여요</span>
  </div>
  <div class="toolbar">
    <div class="tool-left"><span class="status-led" id="connection-led"></span><span id="gpt-status">NPC 방치 생활 · 실제 AI 상태와 별개</span></div>
    <div class="toolbar-actions">
      <button id="theme-btn" type="button" class="tool-btn" title="방 테마 변경">☼ <span>테마</span></button>
      <button id="rain-btn" type="button" class="tool-btn" aria-pressed="false" title="직접 합성한 빗소리">♬ <span>빗소리</span></button>
      <button id="focus-btn" type="button" class="tool-btn" title="포모도로 · 할 일 목록">◷ <span>집중</span></button>
      <button id="more-btn" type="button" class="tool-btn" title="투명도 및 창 설정">⚙</button>
    </div>
  </div>
  <section id="focus-drawer" class="drawer" hidden>
    <div class="drawer-head"><strong>오늘의 작은 목표</strong><button id="focus-close" type="button" aria-label="닫기">×</button></div>
    <div class="focus-row"><span id="timer-display">25:00</span><button id="timer-toggle" type="button">▶ 시작</button><button id="timer-reset" type="button" title="타이머 초기화">↻</button></div>
    <form id="task-form" autocomplete="off"><input id="task-input" maxlength="90" placeholder="집중할 일을 적어 주세요" aria-label="할 일 추가"><button type="submit">＋</button></form>
    <div id="task-list" class="task-list"></div>
    <p>메모는 이 컴퓨터에만 저장됩니다. 타이머는 GPT와 무관한 로컬 기능입니다.</p>
  </section>
  <section id="settings-drawer" class="drawer" hidden>
    <div class="drawer-head"><strong>작은 방 설정</strong><button id="settings-close" type="button" aria-label="닫기">×</button></div>
    <div class="setting-line"><label for="opacity-slider">창 투명도</label><input id="opacity-slider" type="range" min="55" max="100" value="100"><output id="opacity-value">100%</output></div>
    <div class="setting-line"><span>창 크기 및 위치</span><button id="re-dock" type="button">작업 표시줄 위로</button></div>
    <p>창은 상단 제목 부분을 드래그하여 이동할 수 있습니다. 클릭 통과 옵션은 트레이 메뉴에서 관리합니다.</p>
  </section>
</div>
<script type="module" src="/mini.js"></script>
</body>
</html>
